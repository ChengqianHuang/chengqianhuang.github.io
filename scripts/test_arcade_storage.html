<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Arcade storage regression</title>
<style>body{font:14px monospace}iframe{width:100%;height:640px;border:1px solid #bbb}</style>
<p id="result">正在检查存储被禁用时的游戏初始化…</p><iframe title="存储禁用测试"></iframe>
<script type="module">
const frame=document.querySelector('iframe'),result=document.getElementById('result');
try{
 const html=await(await fetch('/games/chronostasis.html')).text();
 frame.srcdoc=html.replace('<head>','<head><script>Object.defineProperty(window,"localStorage",{get(){throw new DOMException("Test storage denied","SecurityError")}})<\/script>');
 await new Promise(resolve=>frame.addEventListener('load',resolve,{once:true}));
 const doc=frame.contentDocument;
 if(doc.querySelectorAll('#ch-levels button').length!==10)throw Error('level initialization failed');
 doc.getElementById('ch-start').click();
 if(!doc.getElementById('ch-menu').hidden)throw Error('start failed without storage');
 result.textContent='PASS · 存储被禁用时仍可初始化十关并开始游戏';
}catch(e){result.textContent='FAIL · '+e.message;console.error(e);}
</script></html>

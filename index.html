<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chengqian Huang</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚒️</text></svg>">
  <script>
    // 主题预设：在任何渲染前设置，避免闪烁
    (function () {
      var t = localStorage.getItem('theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body class="home">
  <canvas id="shader-canvas" aria-hidden="true"></canvas>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="container">
      <a class="site-title" href="/">Chengqian Huang</a>
      <nav>
        <a href="/">文章</a>
        <a href="/about.html">关于</a>
        <a href="https://github.com/ChengqianHuang" target="_blank" rel="noopener">GitHub</a>
        <button id="theme-toggle" type="button"></button>
      </nav>
    </div>
  </header>

  <main>
    <section class="hero container" aria-labelledby="hero-name">
      <div class="hero-text">
        <p class="eyebrow"><span class="status-light"></span> 个人博客 · 深圳</p>
        <h1 id="hero-name" data-text="Chengqian Huang">Chengqian Huang</h1>
        <p class="terminal"><span id="typed"></span><span class="cursor" aria-hidden="true"></span></p>
        <div class="hero-actions">
          <a class="primary-action" href="#post-list">阅读文章 <span aria-hidden="true">↗</span></a>
          <a class="text-action" href="#playground">查看互动 <span aria-hidden="true">↓</span></a>
        </div>
      </div>
      <div class="donut-window" aria-label="正在旋转的 ASCII 甜甜圈">
        <div class="window-bar"><span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span><span>donut.exe</span><span>LIVE ●</span></div>
        <pre id="donut" aria-hidden="true">加载中…</pre>
        <div class="window-footer"><span>42 × 18 字符</span><span>JavaScript 实时绘制</span></div>
      </div>
    </section>

    <section id="playground" class="playground container" aria-labelledby="playground-title">
      <div class="section-heading">
        <div><p class="section-kicker">01</p><h2 id="playground-title">互动演示</h2></div>
        <p>移动指针吸引粒子；点击画布或按钮触发脉冲。</p>
      </div>
      <div class="lab-grid">
        <div class="lab-panel orbit-panel">
          <div class="lab-panel-head"><span><span class="status-light"></span> 粒子场</span><span id="orbit-status">LIVE</span></div>
          <canvas id="orbit-canvas" aria-label="互动粒子引力场，移动指针吸引粒子，点击制造脉冲"></canvas>
          <div class="lab-panel-foot"><span>移动指针吸引 · 点击产生脉冲</span><button id="pulse-button" type="button">触发脉冲</button></div>
        </div>
        <div class="lab-panel console-panel">
          <div class="lab-panel-head"><span>~/chengqian <span class="console-branch">⌁ main</span></span><span>TERMINAL</span></div>
          <div id="console-output" class="console-output" role="log" aria-live="polite" aria-relevant="additions text"><p class="console-welcome">输入 <code>help</code> 查看命令，也可以点击下方按钮。</p></div>
          <form id="console-form" class="console-form" autocomplete="off">
            <label for="console-input">❯</label>
            <input id="console-input" name="command" type="text" spellcheck="false" autocapitalize="off" maxlength="40" aria-label="输入命令" placeholder="输入 help 查看命令">
            <button type="submit" aria-label="执行命令">↵</button>
          </form>
          <div class="command-chips" aria-label="快捷命令"><button type="button" data-command="help">help</button><button type="button" data-command="about">about</button><button type="button" data-command="surprise">surprise</button></div>
        </div>
      </div>
    </section>

    <section id="post-list" class="container">
      <div class="section-heading posts-heading"><div><p class="section-kicker">02</p><h2>文章</h2></div></div>
      <ul id="posts" class="post-list">
        <li class="loading">加载中…</li>
      </ul>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Chengqian Huang · <a href="https://github.com/ChengqianHuang/chengqianhuang.github.io" target="_blank" rel="noopener">本站源码</a> · <span class="hint" title="↑↑↓↓←→←→BA">↑↑↓↓←→←→BA</span></p>
    </div>
  </footer>

  <button id="back-to-top" type="button" title="返回顶部" aria-label="返回顶部">↑</button>

  <script src="theme.js"></script>
  <script src="shader.js"></script>
  <script src="particles.js"></script>
  <script src="donut.js"></script>
  <script src="main.js"></script>
  <script src="playground.js"></script>
  <script src="easter-egg.js"></script>
  <script src="scroll.js"></script>
</body>
</html>

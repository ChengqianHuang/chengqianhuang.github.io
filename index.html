<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chengqian Huang</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚒️</text></svg>">
  <script>
    // 主题预设：在任何渲染前设置，避免闪烁
    (function () {
      var t = localStorage.getItem('theme')
        || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="style.css?v=3">
  <link rel="stylesheet" href="games.css?v=2">
  <link rel="stylesheet" href="pelican.css?v=1.1.2">
</head>
<body class="home">
  <canvas id="shader-canvas" aria-hidden="true"></canvas>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <header class="site-header">
    <div class="container">
      <a class="site-title" href="/">Chengqian Huang</a>
      <nav>
        <a href="/games.html">小游戏</a>
        <a href="#post-list">文章</a>
        <a href="/pelican.html">鹈鹕测试</a>
        <a href="/about.html">关于</a>
        <a href="https://github.com/ChengqianHuang" target="_blank" rel="noopener">GitHub</a>
        <button id="theme-toggle" type="button"></button>
      </nav>
    </div>
  </header>

  <main>
    <div class="home-intro container">
      <p><span class="status-light" aria-hidden="true"></span> 个人博客 · 深圳</p>
      <a href="#post-list">阅读文章 <span aria-hidden="true">↗</span></a>
    </div>

    <section id="arcade" class="games-section container" aria-labelledby="games-title">
      <div class="section-heading">
        <div><p class="section-kicker">01 / ARCADE</p><h1 id="games-title">小游戏</h1></div>
        <a class="games-all" href="/games.html">全部游戏 <span aria-hidden="true">→</span></a>
      </div>
      <div class="games-grid" data-game-catalog data-limit="4" aria-busy="true"><p class="games-loading">加载中…</p></div>
      <noscript><p><a href="/games/breakout.html">玩打砖块 →</a></p></noscript>
    </section>

    <section id="pelican-preview" class="container pelican-home" aria-labelledby="pelican-home-title">
      <div class="section-heading">
        <div><p class="section-kicker">02</p><h2 id="pelican-home-title">鹈鹕测试</h2></div>
        <button id="pelican-motion-toggle" class="pelican-motion" type="button" hidden>暂停</button>
        <a class="pelican-all" href="/pelican.html">查看全部 <span aria-hidden="true">→</span></a>
      </div>
      <div id="pelican-home-grid" class="pelican-grid" aria-busy="true"><p>加载中…</p></div>
      <noscript><p>请启用 JavaScript，或<a href="/pelican.html">打开鹈鹕测试页</a>。</p></noscript>
    </section>

    <section id="post-list" class="container">
      <div class="section-heading posts-heading"><div><p class="section-kicker">03</p><h2>文章</h2></div></div>
      <ul id="posts" class="post-list" aria-busy="true">
        <li class="loading">加载中…</li>
      </ul>
    </section>
  </main>

  <dialog id="pelican-detail" class="pelican-detail" aria-labelledby="pelican-detail-title">
    <div class="pelican-detail-head"><div><h2 id="pelican-detail-title"></h2><p id="pelican-detail-harness"></p></div><button id="pelican-detail-motion" class="pelican-motion" type="button" hidden>暂停</button><button id="pelican-close" class="pelican-close" type="button" aria-label="关闭详情">×</button></div>
    <div class="pelican-detail-body">
      <div class="pelican-detail-picture"><div id="pelican-detail-image"></div><div id="pelican-detail-nav" class="pelican-detail-nav"><button id="pelican-previous" type="button" aria-label="上一张">←</button><button id="pelican-next" type="button" aria-label="下一张">→</button></div></div>
      <div class="pelican-detail-info"><h3>提示词</h3><p id="pelican-detail-prompt"></p></div>
    </div>
  </dialog>
  <footer class="site-footer">
    <div class="container">
      <p>© 2026 Chengqian Huang · <a href="https://github.com/ChengqianHuang/chengqianhuang.github.io" target="_blank" rel="noopener">本站源码</a> · <span class="hint" title="↑↑↓↓←→←→BA">↑↑↓↓←→←→BA</span></p>
    </div>
  </footer>

  <button id="back-to-top" type="button" title="返回顶部" aria-label="返回顶部">↑</button>

  <script src="theme.js"></script>
  <script src="shader.js?v=3"></script>
  <script src="particles.js"></script>
  <script src="main.js?v=2"></script>
  <script src="pelican.js?v=1.1.3"></script>
  <script src="games.js?v=1"></script>
  <script src="easter-egg.js"></script>
  <script src="scroll.js?v=2"></script>
</body>
</html>

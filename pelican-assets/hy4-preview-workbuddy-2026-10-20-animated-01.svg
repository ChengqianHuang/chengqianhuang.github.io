<svg viewBox="0 0 680 396" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Pelican riding a bicycle</title>
<desc>Flat illustration: a pelican with a long amber beak pedals a blue bicycle. Wheels spin, crank turns, legs pump, scarf streams behind.</desc>
<style>
.spin,.crank{transform-box:fill-box;transform-origin:center}
.leg{transform-box:view-box;transform-origin:0px 0px;animation-duration:1.4s;animation-timing-function:linear;animation-iteration-count:infinite}
@media (prefers-reduced-motion:no-preference){
.spin{animation:spin .62s linear infinite}
.crank{animation:spin 1.4s linear infinite}
.tn{animation-name:tn}.sn{animation-name:sn}.fn{animation-name:fn}
.tf{animation-name:tf}.sf{animation-name:sf}.ff{animation-name:ff}
.hd{transform-box:view-box;transform-origin:352px 124px;animation:hd 1.4s ease-in-out infinite}
.sc{transform-box:view-box;transform-origin:348px 132px;animation:sc 1.4s ease-in-out infinite}
.road{animation:road .5s linear infinite}
.zip{animation:zip .5s linear infinite}
}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes tn{0%{transform:translate(300px,225px) rotate(17.5deg)}12.5%{transform:translate(300px,225px) rotate(40.8deg)}25%{transform:translate(300px,225px) rotate(54.4deg)}37.5%{transform:translate(300px,225px) rotate(53.4deg)}50%{transform:translate(300px,225px) rotate(43.4deg)}62.5%{transform:translate(300px,225px) rotate(23.5deg)}75%{transform:translate(300px,225px) rotate(-1.2deg)}87.5%{transform:translate(300px,225px) rotate(-1.6deg)}100%{transform:translate(300px,225px) rotate(17.5deg)}}
@keyframes sn{0%{transform:translate(357px,243px) rotate(92deg)}12.5%{transform:translate(345px,264px) rotate(89.3deg)}25%{transform:translate(335px,274px) rotate(99.3deg)}37.5%{transform:translate(336px,273px) rotate(121.1deg)}50%{transform:translate(344px,266px) rotate(141.4deg)}62.5%{transform:translate(355px,249px) rotate(145.7deg)}75%{transform:translate(360px,224px) rotate(124.4deg)}87.5%{transform:translate(360px,223px) rotate(102.9deg)}100%{transform:translate(357px,243px) rotate(92deg)}}
@keyframes fn{0%{transform:translate(355px,305px)}12.5%{transform:translate(346px,326px)}25%{transform:translate(325px,335px)}37.5%{transform:translate(304px,326px)}50%{transform:translate(295px,305px)}62.5%{transform:translate(304px,284px)}75%{transform:translate(325px,275px)}87.5%{transform:translate(346px,284px)}100%{transform:translate(355px,305px)}}
@keyframes tf{0%{transform:translate(300px,225px) rotate(43.4deg)}12.5%{transform:translate(300px,225px) rotate(23.5deg)}25%{transform:translate(300px,225px) rotate(-1.2deg)}37.5%{transform:translate(300px,225px) rotate(-1.6deg)}50%{transform:translate(300px,225px) rotate(17.5deg)}62.5%{transform:translate(300px,225px) rotate(40.8deg)}75%{transform:translate(300px,225px) rotate(54.4deg)}87.5%{transform:translate(300px,225px) rotate(53.4deg)}100%{transform:translate(300px,225px) rotate(43.4deg)}}
@keyframes sf{0%{transform:translate(344px,266px) rotate(141.4deg)}12.5%{transform:translate(355px,249px) rotate(145.7deg)}25%{transform:translate(360px,224px) rotate(124.4deg)}37.5%{transform:translate(360px,223px) rotate(102.9deg)}50%{transform:translate(357px,243px) rotate(92deg)}62.5%{transform:translate(345px,264px) rotate(89.3deg)}75%{transform:translate(335px,274px) rotate(99.3deg)}87.5%{transform:translate(336px,273px) rotate(121.1deg)}100%{transform:translate(344px,266px) rotate(141.4deg)}}
@keyframes ff{0%{transform:translate(295px,305px)}12.5%{transform:translate(304px,284px)}25%{transform:translate(325px,275px)}37.5%{transform:translate(346px,284px)}50%{transform:translate(355px,305px)}62.5%{transform:translate(346px,326px)}75%{transform:translate(325px,335px)}87.5%{transform:translate(304px,326px)}100%{transform:translate(295px,305px)}}
@keyframes hd{0%,100%{transform:rotate(-2.5deg)}50%{transform:rotate(2.5deg)}}
@keyframes sc{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(6deg)}}
@keyframes road{to{stroke-dashoffset:44}}
@keyframes zip{to{stroke-dashoffset:44}}
</style>


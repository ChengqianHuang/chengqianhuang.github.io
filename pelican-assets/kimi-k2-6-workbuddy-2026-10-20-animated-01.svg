<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 480" width="100%" role="img">
  <title>Pelican riding a bicycle</title>
  <desc>An animated illustration of a pelican pedaling a bicycle with spinning wheels.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <style>
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pedal { to { transform: rotate(360deg); } }
    @keyframes leg-l { 0%,100% { transform: rotate(25deg); } 50% { transform: rotate(-15deg); } }
    @keyframes leg-r { 0%,100% { transform: rotate(-15deg); } 50% { transform: rotate(25deg); } }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    .wheel-group { animation: spin 1.2s linear infinite; transform-origin: 0 0; }
    .pedal-group { animation: pedal 1.2s linear infinite; transform-origin: 350px 310px; }
    .leg-left { animation: leg-l 1.2s ease-in-out infinite; transform-origin: 330px 265px; }
    .leg-right { animation: leg-r 1.2s ease-in-out infinite; transform-origin: 330px 265px; }
    .pelican-body { animation: bob 1.2s ease-in-out infinite; }
    @media (prefers-reduced-motion: reduce) {
      .wheel-group, .pedal-group, .leg-left, .leg-right, .pelican-body {
        animation: none !important;
      }
    }
  </style>

  <!-- Ground -->
  <rect x="0" y="420" width="680" height="60" fill="#EAF3DE"/>
  <line x1="0" y1="420" x2="680" y2="420" stroke="#97C459" stroke-width="2"/>

  <!-- Rear Wheel -->
  <g transform="translate(180, 340)">
    <circle cx="0" cy="0" r="58" fill="none" stroke="#444441" stroke-width="6"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#D3D1C7" stroke-width="2"/>
    <g class="wheel-group">
      <circle cx="0" cy="0" r="6" fill="#5F5E5A"/>
      <line x1="0" y1="-52" x2="0" y2="52" stroke="#B4B2A9" stroke-width="2"/>
      <line x1="-52" y1="0" x2="52" y2="0" stroke="#B4B2A9" stroke-width="2"/>
      <line x1="-37" y1="-37" x2="37" y2="37" stroke="#B4B2A9" stroke-width="2"/>
      <line x1="37" y1="-37" x2="-37" y2="37" stroke="#B4B2A9" stroke-width="2"/>
    </g>
  </g>

  <!-- Front Wheel -->
  <g transform="translate(500, 340)">
    <circle cx="0" cy="0" r="58" fill="none" stroke="#444441" stroke-width="6"/>
    <circle cx="0" cy="0" r="52" fill="none" stroke="#D3D1C7" stroke-width="2"/>
    <g class="wheel-group">
      <circle cx="0" cy="0" r="6" fill="#5F5E5A"/>
      <line x1="0" y1="-52" x2="0" y2="52" stroke="#B4B2A9" stroke-width="2"/>
      <line x1="-52" y1="0" x2="52" y2="0" stroke="#B4B2A9" stroke-width="2"/>
      <line x1="-37" y1="-37" x2="37" y2="37" stroke="#B4B2A9" stroke-width="2"/>
      <line x1="37" y1="-37" x2="-37" y2="37" stroke="#B4B2A9" stroke-width="2"/>
    </g>
  </g>

  <!-- Bicycle Frame -->
  <g stroke="#D85A30" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
    <line x1="180" y1="340" x2="350" y2="310"/>
    <line x1="180" y1="340" x2="320" y2="220"/>
    <line x1="320" y1="220" x2="350" y2="310"/>
    <line x1="320" y1="220" x2="460" y2="210"/>
    <line x1="460" y1="210" x2="480" y2="260"/>
    <line x1="480" y1="260" x2="500" y2="340"/>
    <line x1="320" y1="220" x2="310" y2="170"/>
    <line x1="310" y1="170" x2="305" y2="150" stroke="#5F5E5A"/>
  </g>

  <!-- Seat -->
  <path d="M290 150 Q305 145 320 150 L315 160 L295 160 Z" fill="#3C3489"/>

  <!-- Handlebars -->
  <path d="M460 210 Q450 190 470 185 Q490 180 495 195" fill="none" stroke="#5F5E5A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="495" cy="195" r="4" fill="#5F5E5A"/>

  <!-- Pedal mechanism -->
  <circle cx="350" cy="310" r="10" fill="#5F5E5A"/>

  <!-- Pedals (animated) -->
  <g class="pedal-group">
    <line x1="350" y1="310" x2="350" y2="350" stroke="#5F5E5A" stroke-width="4" stroke-linecap="round"/>
    <rect x="340" y="348" width="20" height="8" rx="2" fill="#3C3489"/>
    <line x1="350" y1="310" x2="350" y2="270" stroke="#5F5E5A" stroke-width="4" stroke-linecap="round"/>
    <rect x="340" y="264" width="20" height="8" rx="2" fill="#3C3489"/>
  </g>

  <!-- Legs -->
  <g class="leg-left" stroke="#D85A30" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="330" y1="265" x2="350" y2="310"/>
    <line x1="350" y1="310" x2="350" y2="350"/>
  </g>
  <g class="leg-right" stroke="#D85A30" stroke-width="5" stroke-linecap="round" fill="none">
    <line x1="330" y1="265" x2="350" y2="310"/>
    <line x1="350" y1="310" x2="350" y2="270"/>
  </g>

  <!-- Pelican Body -->
  <g class="pelican-body">
    <path d="M240 240 L200 260 L210 230 Z" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="300" cy="240" rx="70" ry="45" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="2"/>
    <path d="M260 235 Q300 220 340 235 Q320 255 280 255 Z" fill="#D3D1C7" stroke="#B4B2A9" stroke-width="2" stroke-linejoin="round"/>
    <path d="M350 230 Q370 200 360 170" fill="none" stroke="#F1EFE8" stroke-width="18" stroke-linecap="round"/>
    <path d="M350 230 Q370 200 360 170" fill="none" stroke="#B4B2A9" stroke-width="2" stroke-linecap="round"/>
    <ellipse cx="360" cy="160" rx="18" ry="16" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="2"/>
    <circle cx="355" cy="156" r="3" fill="#2C2C2A"/>
    <circle cx="356" cy="155" r="1" fill="white"/>
    <path d="M372 155 Q420 155 445 165 L370 165 Z" fill="#FAC775" stroke="#BA7517" stroke-width="2" stroke-linejoin="round"/>
    <path d="M372 165 Q400 195 445 165 L440 160 Q400 180 375 160 Z" fill="#F5C4B3" stroke="#D85A30" stroke-width="2" stroke-linejoin="round"/>
    <ellipse cx="350" cy="354" rx="10" ry="4" fill="#D85A30"/>
    <ellipse cx="350" cy="266" rx="10" ry="4" fill="#D85A30"/>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-labelledby="ttl dsc">
<title id="ttl">A pelican pedalling a bicycle at dusk</title>
<desc id="dsc">A cream pelican with a coral scarf rides a teal bicycle along a dusk road. Both wheels turn, the legs pedal through a full crank rotation, the scarf, tail and head crest flutter, and the road markings scroll past. All motion stops when reduced motion is requested.</desc>

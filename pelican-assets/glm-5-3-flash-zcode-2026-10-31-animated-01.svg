        <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="M352 300 Q396 370 371 448;M352 300 Q400 359 375.6 431;M352 300 Q406 348 388 418.6;M352 300 Q413 341 405 414;M352 300 Q418 341 422 418.6;M352 300 Q422 347 434.4 431;M352 300 Q423 358 439 448;M352 300 Q421 369 434.4 465;M352 300 Q415 378 422 477.4;M352 300 Q407 383 405 482;M352 300 Q401 383 388 477.4;M352 300 Q396 378 375.6 465;M352 300 Q396 370 371 448"/>
      </path>
    </g>

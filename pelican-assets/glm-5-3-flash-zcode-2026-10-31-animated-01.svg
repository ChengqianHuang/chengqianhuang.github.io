<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-labelledby="pv-title pv-desc">
  <title id="pv-title">A pelican riding a bicycle</title>
  <desc id="pv-desc">A cartoon pelican pedals a red bicycle. The wheels turn, the cranks rotate, and the pelican's legs follow the pedals. When the system prefers reduced motion, a static mid-pedal pose is shown instead.</desc>
  <style>
    .pv-still { display: none; }
    .pv-bob { animation: pv-bob 0.8s ease-in-out infinite; }
    @keyframes pv-bob {
      50% { transform: translateY(-2.6px); }
    }
    @media (prefers-reduced-motion: reduce) {
      .pv-motion { display: none !important; }
      .pv-still { display: inline !important; }
      .pv-bob { animation: none !important; }
    }
  </style>

  <!-- scene -->
  <rect width="800" height="600" fill="#eaf6fd"/>
  <circle cx="700" cy="92" r="38" fill="#ffe9a8"/>
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="150" cy="112" rx="46" ry="18"/>
    <ellipse cx="185" cy="100" rx="34" ry="15"/>
    <ellipse cx="118" cy="102" rx="30" ry="13"/>
    <ellipse cx="430" cy="72" rx="40" ry="15"/>
    <ellipse cx="462" cy="62" rx="28" ry="12"/>
  </g>
  <rect y="514" width="800" height="86" fill="#e2f0cf"/>
  <line x1="0" y1="514" x2="800" y2="514" stroke="#a9cc8e" stroke-width="3"/>
  <ellipse cx="240" cy="517" rx="96" ry="8" fill="#1b2a1b" opacity="0.08"/>
  <ellipse cx="580" cy="517" rx="96" ry="8" fill="#1b2a1b" opacity="0.08"/>

  <!-- far leg (behind the frame) -->
  <g fill="none" stroke-linecap="round">
    <g class="pv-motion">
      <path d="M352 300 Q423 358 439 448" stroke="#6e4410" stroke-width="12">
        <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="M352 300 Q423 358 439 448;M352 300 Q421 369 434.4 465;M352 300 Q415 378 422 477.4;M352 300 Q407 383 405 482;M352 300 Q401 383 388 477.4;M352 300 Q396 378 375.6 465;M352 300 Q396 370 371 448;M352 300 Q400 359 375.6 431;M352 300 Q406 348 388 418.6;M352 300 Q413 341 405 414;M352 300 Q418 341 422 418.6;M352 300 Q422 347 434.4 431;M352 300 Q423 358 439 448"/>
      </path>
      <path d="M352 300 Q423 358 439 448" stroke="#c97917" stroke-width="6">
        <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="M352 300 Q423 358 439 448;M352 300 Q421 369 434.4 465;M352 300 Q415 378 422 477.4;M352 300 Q407 383 405 482;M352 300 Q401 383 388 477.4;M352 300 Q396 378 375.6 465;M352 300 Q396 370 371 448;M352 300 Q400 359 375.6 431;M352 300 Q406 348 388 418.6;M352 300 Q413 341 405 414;M352 300 Q418 341 422 418.6;M352 300 Q422 347 434.4 431;M352 300 Q423 358 439 448"/>
      </path>
    </g>
    <g class="pv-still" style="display:none">

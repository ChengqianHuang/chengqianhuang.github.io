    <circle cx="240" cy="430" r="71" fill="none" stroke="#b7c3c9" stroke-width="3"/>
    <g class="pv-motion" stroke="#9aa7ad" stroke-width="2.5">
      <line x1="169" y1="430" x2="311" y2="430"/>
      <line x1="240" y1="359" x2="240" y2="501"/>
      <line x1="189.8" y1="379.8" x2="290.2" y2="480.2"/>
      <line x1="189.8" y1="480.2" x2="290.2" y2="379.8"/>
      <animateTransform attributeName="transform" type="rotate" from="0 240 430" to="360 240 430" dur="0.9s" repeatCount="indefinite"/>

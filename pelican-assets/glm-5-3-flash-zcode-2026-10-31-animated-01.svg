      <path d="M352 300 Q415 378 422 477.4" stroke="#c97917" stroke-width="6"/>
    </g>
  </g>

  <!-- far pedal + webbed foot -->
  <g class="pv-motion">
    <rect x="-9" y="1" width="18" height="5.5" rx="2" fill="#20262a"/>
    <path d="M-8 -3 L12 -4 L20 3 L13 8 L-8 5 Z" fill="#c97917" stroke="#6e4410" stroke-width="1.5"/>
    <animateTransform attributeName="transform" type="translate" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="439 448;434.4 465;422 477.4;405 482;388 477.4;375.6 465;371 448;375.6 431;388 418.6;405 414;422 418.6;434.4 431;439 448"/>
  </g>

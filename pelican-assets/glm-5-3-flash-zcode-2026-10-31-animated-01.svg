  <circle cx="405" cy="448" r="17" fill="none" stroke="#57606f" stroke-width="5"/>
  <line x1="403" y1="431" x2="241" y2="421" stroke="#57606f" stroke-width="3.5"/>
  <line x1="399" y1="465" x2="245" y2="439" stroke="#57606f" stroke-width="3.5"/>
  <g class="pv-motion" stroke="#4a5560" stroke-width="6" stroke-linecap="round">
    <line x1="405" y1="448" x2="371" y2="448"/>
    <line x1="405" y1="448" x2="439" y2="448"/>
    <animateTransform attributeName="transform" type="rotate" from="0 405 448" to="360 405 448" dur="1.6s" repeatCount="indefinite"/>
  </g>
  <g class="pv-still" style="display:none" stroke="#4a5560" stroke-width="6" stroke-linecap="round">
    <line x1="405" y1="448" x2="388" y2="418.6"/>
    <line x1="405" y1="448" x2="422" y2="477.4"/>
  </g>
  <circle cx="405" cy="448" r="5.5" fill="#2d3436"/>

  <!-- pelican -->
  <g class="pv-bob">
    <path d="M266 246 L230 224 L241 246 L226 250 L262 264 Z" fill="#ffffff" stroke="#ccd6dd" stroke-width="2.5" stroke-linejoin="round"/>
    <ellipse cx="322" cy="266" rx="62" ry="45" transform="rotate(-10 322 266)" fill="#ffffff" stroke="#ccd6dd" stroke-width="3"/>
    <path d="M296 254 Q328 236 354 256 Q344 284 306 280 Q290 268 296 254 Z" fill="#f1f5f8" stroke="#ccd6dd" stroke-width="2.5"/>
    <path d="M358 250 C390 242 400 212 407 174" fill="none" stroke="#ccd6dd" stroke-width="19" stroke-linecap="round"/>
    <path d="M358 250 C390 242 400 212 407 174" fill="none" stroke="#ffffff" stroke-width="13" stroke-linecap="round"/>
    <circle cx="411" cy="157" r="18" fill="#ffffff" stroke="#ccd6dd" stroke-width="3"/>
    <path d="M423 171 L509 193 Q478 224 438 199 Q426 188 423 171 Z" fill="#f39c12" stroke="#e08e0b" stroke-width="2" stroke-linejoin="round"/>
    <path d="M423 148 L513 184 L509 193 L423 171 Z" fill="#f6b93b" stroke="#e08e0b" stroke-width="2" stroke-linejoin="round"/>
    <path d="M432 154 L470 168" fill="none" stroke="#e08e0b" stroke-width="2" stroke-linecap="round"/>
    <path d="M394 152 Q398 126 416 127 Q433 129 430 149 Z" fill="#e74c3c" stroke="#b93a2b" stroke-width="2" stroke-linejoin="round"/>
    <path d="M392 153 L432 149" fill="none" stroke="#b93a2b" stroke-width="3" stroke-linecap="round"/>
    <path d="M407 132 L405 141 M419 133 L417 142" fill="none" stroke="#c0392b" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="420" cy="154" r="3.2" fill="#2d3436"/>
    <circle cx="421.2" cy="152.8" r="1.1" fill="#ffffff"/>
  </g>

  <!-- near leg -->
  <g fill="none" stroke-linecap="round">
    <g class="pv-motion">
      <path d="M352 300 Q396 370 371 448" stroke="#a85f10" stroke-width="12">
        <animate attributeName="d" dur="1.6s" repeatCount="indefinite" calcMode="linear" values="M352 300 Q396 370 371 448;M352 300 Q400 359 375.6 431;M352 300 Q406 348 388 418.6;M352 300 Q413 341 405 414;M352 300 Q418 341 422 418.6;M352 300 Q422 347 434.4 431;M352 300 Q423 358 439 448;M352 300 Q421 369 434.4 465;M352 300 Q415 378 422 477.4;M352 300 Q407 383 405 482;M352 300 Q401 383 388 477.4;M352 300 Q396 378 375.6 465;M352 300 Q396 370 371 448"/>
      </path>

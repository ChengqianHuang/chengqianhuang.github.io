        50% { d: path("M 448 351 L 553.31 418.34 L 520 544"); }
        56.25% { d: path("M 448 351 L 543.22 431.99 L 516.96 559.31"); }
        62.5% { d: path("M 448 351 L 531.17 444.31 L 508.28 572.28"); }
        68.75% { d: path("M 448 351 L 519.84 453.29 L 495.31 580.96"); }
        75% { d: path("M 448 351 L 512.44 458.11 L 480 584"); }
        81.25% { d: path("M 448 351 L 510.46 459.28 L 464.69 580.96"); }
        87.5% { d: path("M 448 351 L 513.12 457.70 L 451.72 572.28"); }
        93.75% { d: path("M 448 351 L 519.05 453.84 L 443.04 559.31"); }
      }
      @media (prefers-reduced-motion: reduce) {
        .spin, .level, .near-leg, .far-leg, .scarf-tail, .road { animation: none !important; }
      }
    </style>

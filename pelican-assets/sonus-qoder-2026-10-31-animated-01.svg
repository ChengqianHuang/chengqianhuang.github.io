      <path d="M4-4L15 3M-3-3L3 4" fill="none" stroke="#b87a33" stroke-width="1.5"/>
      <path d="M-18 10H20" stroke="#24474a" stroke-width="6" stroke-linecap="round"/>
    </g>
    <style>
      .spin { animation: turn 1.8s linear infinite; }
      .level { animation: counter-turn 1.8s linear infinite; }
      .near-leg { animation: near-pedal 1.8s linear infinite; }
      .far-leg { animation: far-pedal 1.8s linear infinite; }
      .scarf-tail { animation: breeze 1.8s ease-in-out infinite; transform-origin: 502px 276px; }
      .road { animation: pass-by 1.8s linear infinite; }
      @keyframes turn { to { transform: rotate(360deg); } }
      @keyframes counter-turn { to { transform: rotate(-360deg); } }
      @keyframes breeze { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(4deg); } }
      @keyframes pass-by { to { transform: translateX(-160px); } }
      @keyframes near-pedal {
        0%,100% { d: path("M 430 354 L 538.89 415.38 L 520 544"); }
        6.25% { d: path("M 430 354 L 529.32 429.90 L 516.96 559.31"); }
        12.5% { d: path("M 430 354 L 518.12 442.66 L 508.28 572.28"); }
        18.75% { d: path("M 430 354 L 508.11 451.59 L 495.31 580.96"); }
        25% { d: path("M 430 354 L 502.35 455.94 L 480 584"); }
        31.25% { d: path("M 430 354 L 501.76 456.35 L 464.69 580.96"); }
        37.5% { d: path("M 430 354 L 505.24 453.82 L 451.72 572.28"); }
        43.75% { d: path("M 430 354 L 511.49 448.79 L 443.04 559.31"); }
        50% { d: path("M 430 354 L 519.57 441.19 L 440 544"); }
        56.25% { d: path("M 430 354 L 528.61 430.82 L 443.04 528.69"); }
        62.5% { d: path("M 430 354 L 537.40 417.95 L 451.72 515.72"); }
        68.75% { d: path("M 430 354 L 544.41 404.35 L 464.69 507.04"); }
        75% { d: path("M 430 354 L 548.58 393.56 L 480 504"); }
        81.25% { d: path("M 430 354 L 549.97 389.10 L 495.31 507.04"); }
        87.5% { d: path("M 430 354 L 549 392.26 L 508.28 515.72"); }
        93.75% { d: path("M 430 354 L 545.47 401.86 L 516.96 528.69"); }
      }
      @keyframes far-pedal {
        0%,100% { d: path("M 448 351 L 527.27 447.65 L 440 544"); }
        6.25% { d: path("M 448 351 L 536.96 438.81 L 443.04 528.69"); }
        12.5% { d: path("M 448 351 L 547.01 427.30 L 451.72 515.72"); }
        18.75% { d: path("M 448 351 L 555.79 414.30 L 464.69 507.04"); }
        25% { d: path("M 448 351 L 561.72 402.90 L 480 504"); }
        31.25% { d: path("M 448 351 L 564.29 396.85 L 495.31 507.04"); }
        37.5% { d: path("M 448 351 L 563.77 398.15 L 508.28 515.72"); }

<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800" role="img" aria-labelledby="title description">
  <title id="title">The scenic route — a pelican on a bicycle</title>
  <desc id="description">An ivory pelican with a long golden bill and a terracotta scarf pedals a teal bicycle along the coast. Both spoked wheels turn clockwise, and its webbed feet follow the pedals. All animation stops when reduced motion is preferred.</desc>
  <defs>
    <pattern id="paper" width="7" height="7" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="2" r=".55" fill="#76664f" opacity=".065"/>
      <circle cx="5" cy="6" r=".4" fill="#76664f" opacity=".05"/>
    </pattern>
    <pattern id="road-marks" width="160" height="20" patternUnits="userSpaceOnUse">
      <path d="M 12 10 H 58" stroke="#a6b3a1" stroke-width="2" stroke-linecap="round"/>
      <path d="M 114 16 H 126" stroke="#a6b3a1" stroke-width="2" stroke-linecap="round"/>
    </pattern>
    <clipPath id="road-window"><rect x="174" y="681" width="674" height="24" rx="12"/></clipPath>
    <g id="spokes" fill="none" stroke="#82948a" stroke-width="1.8">
      <path d="M-105 0H105 M0-105V105 M-74.25-74.25L74.25 74.25 M-74.25 74.25L74.25-74.25 M-97-40.2L97 40.2 M-97 40.2L97-40.2 M-40.2-97L40.2 97 M-40.2 97L40.2-97"/>

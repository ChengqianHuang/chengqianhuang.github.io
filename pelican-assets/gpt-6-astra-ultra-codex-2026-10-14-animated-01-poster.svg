<title id="title">A pelican cycling along the coast</title>
<desc id="description">A white pelican with a long golden bill and a teal scarf rides a coral bicycle. Its webbed feet stay on the pedals as its knees bend, both wheels turn, and the coastal road moves beneath it. Reduced-motion mode shows a completely still illustration.</desc>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" role="img" aria-labelledby="t d">
  <title id="t">Pelican riding a bicycle</title>
  <desc id="d">A cartoon pelican wearing a helmet pedals a bicycle along a road while its wheels spin and clouds drift by. All motion is disabled when the viewer prefers reduced motion.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#bfe4f4"/>
      <stop offset="1" stop-color="#edf7fc"/>
    </linearGradient>
  </defs>
  <style>
    .wheel-r { transform-box: view-box; transform-origin: 230px 340px; animation: spin 1.15s linear infinite; }
    .wheel-f { transform-box: view-box; transform-origin: 560px 340px; animation: spin 1.15s linear infinite; }
    .crank-n { transform-box: view-box; transform-origin: 410px 350px; animation: crankN 1.6s linear infinite; }
    .crank-f { transform-box: view-box; transform-origin: 410px 350px; animation: crankF 1.6s linear infinite; }
    .pedal-n { animation: pedalN 1.6s linear infinite; }
    .pedal-f { animation: pedalF 1.6s linear infinite; }
    .leg-n { fill: none; stroke: #d99a55; stroke-width: 11; stroke-linecap: round; stroke-linejoin: round; animation: legN 1.6s linear infinite; }
    .leg-f { fill: none; stroke: #b8874a; stroke-width: 10; stroke-linecap: round; stroke-linejoin: round; animation: legF 1.6s linear infinite; }
    .foot-n { fill: none; stroke: #f2a13c; stroke-width: 9; stroke-linecap: round; animation: footN 1.6s linear infinite; }
    .foot-f { fill: none; stroke: #cf8a33; stroke-width: 8; stroke-linecap: round; animation: footF 1.6s linear infinite; }
    .bob { animation: bob 0.8s ease-in-out infinite; }
    .cloud-a { animation: cloudA 40s linear infinite; }
    .cloud-b { animation: cloudB 55s linear infinite; }
    .dash { animation: road 1.831s linear infinite; }
    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    @keyframes crankN { from { transform: rotate(20deg); } to { transform: rotate(380deg); } }
    @keyframes crankF { from { transform: rotate(200deg); } to { transform: rotate(560deg); } }
    @keyframes bob { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(3px); } }
    @keyframes cloudA { from { transform: translate(0px, 0px); } to { transform: translate(-1180px, 0px); } }
    @keyframes cloudB { from { transform: translate(0px, 0px); } to { transform: translate(-1330px, 0px); } }
    @keyframes road { from { stroke-dashoffset: 0; } to { stroke-dashoffset: 800; } }
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none !important; }
    }

<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600" role="img" aria-label="A pelican riding a bicycle"><title>A pelican riding a bicycle</title><style>
.spin,.crank{animation:turn 1.8s linear infinite;transform-origin:0px 0px}
.level{animation:level 1.8s linear infinite;transform-origin:0px 0px}
.dashes{animation:roll 1.8s linear infinite}
.far{animation:drift 26s linear infinite}
.hills{animation:drift2 34s linear infinite}
.hills2{animation:drift3 20s linear infinite}
.tail{transform-origin:300px 264px;animation:wag 1.8s ease-in-out infinite}
.lid{animation:blink 4.6s ease-in-out infinite}
.rest-leg{display:none}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes level{to{transform:rotate(-360deg)}}
@keyframes roll{to{transform:translateX(-96px)}}
@keyframes drift{to{transform:translateX(-260px)}}
@keyframes drift2{to{transform:translateX(-40px)}}
@keyframes drift3{to{transform:translateX(-60px)}}
@keyframes wag{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(4deg)}}
@keyframes blink{0%,92%,100%{opacity:0}95%,97%{opacity:1}}
@media(prefers-reduced-motion:reduce){
.spin,.crank,.level,.dashes,.far,.hills,.hills2,.tail,.lid{animation:none!important}
.pedal-leg{display:none}
.rest-leg{display:inline}
}
</style><defs>

      <path d="M154 418l94 32m458-31-95 31" stroke-width="2.3"/>
      <path d="M543 350l17 43q15 37 51 57" stroke-width="13.5"/>
      <path d="M543 350l17 43q15 37 51 57" stroke="#ee9667" stroke-width="8"/>
      <path d="M566 400q15 31 43 45" stroke="#fbd19a" stroke-width="1.55"/>


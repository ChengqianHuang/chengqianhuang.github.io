          <circle r="20.1" fill="none" stroke-width="1.8" stroke-dasharray="1.2 3.1"/>
          <circle r="14.5" fill="#a4845d" stroke-width="1.8"/>
          <path d="M-15 0h30M0-15v30" fill="none" stroke="#d4b27a" stroke-width="4"/>
          <path d="M-24 0H24" fill="none" stroke-width="8.2"/>
          <path d="M0 0H24" fill="none" stroke="#f0d09a" stroke-width="4"/>
          <circle r="5" fill="#ebd29c" stroke-width="2"/>
        </g>
      </g>
    </g>

    <g class="outline" style="color:#eea856">
      <g class="pedal-motion near-thigh" transform="translate(374.00 330.00) rotate(36.67)" color="#f6e4bd">
        <use href="#thigh"/>
      </g>
      <g class="pedal-motion near-shin" transform="translate(428.54 370.61) rotate(95.41)">
        <use href="#shin"/>
      </g>
      <g class="pedal-motion near-foot" transform="translate(425.19 456.27)">
        <use href="#foot"/>
      </g>
    </g>

    <!-- Pelican. The belly overlaps the hips, and the wing curls over the grip. -->
    <path d="M252 301
      C275 308 294 299 320 286C340 275 362 275 383 280
      C398 274 406 259 405 238C405 218 400 199 405 180
      C409 164 415 151 430 142
      C419 143 409 141 398 135Q410 134 428 129
      Q414 127 408 118C422 121 438 117 452 118
      C481 115 502 130 512 149C523 171 515 194 503 210
      C493 222 481 229 474 245C465 267 474 288 458 322
      C445 350 423 366 394 372C358 379 315 367 286 354
      C273 348 263 342 248 332Q261 333 270 333
      C254 327 241 315 234 302Q245 306 252 307Z"

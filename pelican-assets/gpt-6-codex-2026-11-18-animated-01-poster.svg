    <g fill="none" stroke="#819471" stroke-width="2" stroke-linecap="round">
      <path d="M65 444q-2-16-11-23m12 24q5-20 16-25m-16 24q-12-12-22-11m36 6q2-9 9-12m-9 12q-2-7-6-9"/>
      <path d="M792 449q-4-23-16-30m16 29q4-31 15-38m-14 37q8-16 22-19m-15 18q11-9 19-7m-38 11q-6-13-15-15"/>
      <path d="M717 429q2-9 9-12m-10 13q-3-8-8-10" stroke-width="1.5"/>

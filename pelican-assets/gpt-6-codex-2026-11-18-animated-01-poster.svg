    <path d="M12 353c81-10 118-24 171-23 93 1 131 18 197 16 101-3 130-23 223-21 100 2 144 12 245-8v163H12Z" fill="#90b9a8"/>
    <path d="M12 372c123 9 173-28 280-23 60 3 99 20 166 21 116 3 130-22 240-19 67 2 105-5 150-12v141H12Z" fill="#79ab9d"/>
    <path d="M12 398q78 3 151-10t155-6q116 11 242-1t288-11v111H12Z" fill="#a4c4a9"/>
    <g fill="none" stroke="#e8edcd" stroke-linecap="round" opacity=".8">

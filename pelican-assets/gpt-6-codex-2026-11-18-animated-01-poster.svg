    <circle cx="470" cy="175" r="8.2" fill="#293f39"/>
    <circle cx="472.6" cy="172.1" r="2.5" fill="#fffbee"/>
    <path d="M455 193q4 5 12 5" fill="none" stroke="#bd966f" stroke-width="2.2" stroke-linecap="round"/>


      <path d="M94 194h73m21 0h18m539 36h40m-68 0h12" stroke="#f7f3d8" stroke-width="2" stroke-linecap="round"/>
    </g>

    <g fill="none" stroke="#56837a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

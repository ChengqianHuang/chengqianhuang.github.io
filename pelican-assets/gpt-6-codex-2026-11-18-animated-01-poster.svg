    <path d="M325 333q20 3 40-1" fill="none" stroke="#837257" stroke-width="1.7" stroke-linecap="round"/>

    <g class="crank pedal-motion">
      <g transform="translate(404 445)">
        <g transform="rotate(28)" class="outline">

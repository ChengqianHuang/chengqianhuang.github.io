<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 610" width="860" height="610"
     role="img" aria-labelledby="title description">
  <title id="title">Pelican on a bicycle</title>
  <desc id="description">A white pelican rides an orange bicycle along a sunny coast.</desc>
  <defs>
    <clipPath id="picture">
      <rect x="12" y="12" width="836" height="586" rx="29"/>
    </clipPath>
    <linearGradient id="sky" x2="0" y2="1">
      <stop stop-color="#a9d7cb"/>
      <stop offset="1" stop-color="#e6edce"/>
    </linearGradient>
    <linearGradient id="road" x2="0" y2="1">
      <stop stop-color="#e7bc86"/>
      <stop offset="1" stop-color="#f5d7a4"/>
    </linearGradient>
    <linearGradient id="plumage" x1="0" x2=".24" y1="0" y2="1">
      <stop stop-color="#fff8df"/>
      <stop offset=".64" stop-color="#fff5da"/>
      <stop offset="1" stop-color="#e6d9b7"/>
    </linearGradient>
    <linearGradient id="pouch" x2=".2" y2="1">
      <stop stop-color="#f5bf70"/>
      <stop offset="1" stop-color="#e89953"/>
    </linearGradient>
    <pattern id="sand-grain" width="87" height="39" patternUnits="userSpaceOnUse">
      <path d="M7 12h5m18 20h9m22-24h3m12 17h3m-28-4h2M3 36h2" fill="none"
            stroke="#a86e50" stroke-linecap="round" opacity=".24"/>
      <path d="M20 19h4m32 17h7m9-25h5" fill="none" stroke="#fff0c7"
            stroke-width="1.3" stroke-linecap="round" opacity=".65"/>
    </pattern>
    <g id="wheel">
      <circle r="101" fill="none" stroke="#233c3b" stroke-width="14"/>
      <circle r="100" fill="none" stroke="#ba9a69" stroke-width="1.5"/>
      <circle r="93.5" fill="none" stroke="#f9dfaa" stroke-width="4"/>
      <circle r="90.5" fill="none" stroke="#344c47" stroke-width="1.6"/>
    </g>
    <g id="spoke-pair" fill="none" stroke-linecap="round">
      <path d="M-4-4 17-89M4 2-17-89" stroke="#52746a" stroke-width="1.3"/>
      <path d="M-2-96h4" stroke="#ffe7b5" stroke-width="1.5"/>
    </g>
    <g id="spokes">
      <use href="#spoke-pair"/><use href="#spoke-pair" transform="rotate(45)"/>
      <use href="#spoke-pair" transform="rotate(90)"/><use href="#spoke-pair" transform="rotate(135)"/>
      <use href="#spoke-pair" transform="rotate(180)"/><use href="#spoke-pair" transform="rotate(225)"/>
      <use href="#spoke-pair" transform="rotate(270)"/><use href="#spoke-pair" transform="rotate(315)"/>
      <path d="M56-66 67-55" fill="none" stroke="#25403d" stroke-width="6" stroke-linecap="round"/>
      <path d="M56-66 67-55" fill="none" stroke="#f1ac57" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M-52 81l3-5" stroke="#25403d" stroke-width="2.2" stroke-linecap="round"/>
    </g>
    <g id="hub">
      <circle r="10.2" fill="#2a4540"/>
      <circle r="5.8" fill="#dac393"/>
      <circle r="2.4" fill="#46645a"/>
    </g>
    <g id="thigh">
      <path d="M0-12C22-16 42-13 60-9C71-7 73 6 64 10C42 15 18 18 0 13Z"
            fill="currentColor" stroke="#314541" stroke-width="3.4"/>
      <path d="m35-9 13 2m-5 5 13 2" stroke="#9f8663" stroke-width="1.4" opacity=".46"/>
    </g>
    <g id="shin">
      <path d="M0 0H78" stroke="#3a463d" stroke-width="13" stroke-linecap="round"/>
      <path d="M0 0H78" stroke="currentColor" stroke-width="7.5" stroke-linecap="round"/>
      <path d="M6-1.5H65" stroke="#f7c982" stroke-width="1.5" opacity=".75" stroke-linecap="round"/>
    </g>
    <g id="foot">
      <path d="M-9-13C-6-15-2-13 0-10C6-11 11-11 18-9L23-6C25-5 25-2 22-2L-8-2C-12-2-14-7-9-13Z"
            fill="currentColor" stroke="#3b4639" stroke-width="2.7" stroke-linejoin="round"/>
      <path d="m7-7 11 2m-6-5 7 2" fill="none" stroke="#9c633e" stroke-width="1.2" stroke-linecap="round"/>
      <rect x="-14" y="-2" width="33" height="7" rx="3" fill="#2a423c"/>
      <path d="M-8 1.5h13" stroke="#efb767" stroke-width="1.6" stroke-linecap="round"/>
      <circle r="2.25" fill="#f3d397"/>
    </g>
  </defs>
  <style>
    .outline {
      stroke: #2b433d;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
  </style>

  <rect width="860" height="610" rx="37" fill="#f8eed4"/>

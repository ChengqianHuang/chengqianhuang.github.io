      <path d="m248 450 105-97 51 92-156 5m105-97 195 7 12 31-156 54" stroke-width="13"/>
      <path d="m248 450 105-97 51 92-156 5m105-97 195 7 12 31-156 54" stroke="#db7550" stroke-width="8"/>
      <path d="m256 442 90-84m16-3 179 6m11 31-143 49m-18 4-134 4"
            stroke="#f7b380" stroke-width="1.55"/>
      <path d="m545 352-11-28q-4-12 9-12h31m-223 39-8-19" stroke-width="9"/>
      <path d="m545 352-11-28q-4-12 9-12h31m-223 39-8-19" stroke="#e4cf9d" stroke-width="4.5"/>
      <path d="M555 312h21" stroke-width="10.5"/>
      <path d="M562 309h10" stroke="#6f7c5c" stroke-width="1.55"/>
      <path d="M529 324q-33 31 10 72" stroke-width="1.6"/>
    </g>
    <use href="#hub" x="248" y="450"/>
    <use href="#hub" x="611" y="450"/>
    <path d="M319 332c7-6 28 0 40-3 12-2 16-1 18 3 0 5-7 7-20 7l-31 2c-8-1-10-5-7-9Z"

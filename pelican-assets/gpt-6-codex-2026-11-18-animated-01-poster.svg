    <path d="M112 563c85-9 203-10 319-10 123 0 241 2 315 10 24 3 15 9-7 10-147 10-485 11-622 0-27-2-32-7-5-10Z"
          fill="#a56850" opacity=".19"/>
    <ellipse cx="248" cy="559" rx="55" ry="5.4" fill="#976147" opacity=".28"/>
    <ellipse cx="612" cy="559" rx="55" ry="5.4" fill="#976147" opacity=".28"/>

    <!-- Wheels. The bars on the rims make the rotation visible at a glance. -->
    <use href="#wheel" x="248" y="450"/>
    <use href="#wheel" x="611" y="450"/>
    <g class="wheel-spokes rear-spokes"><use href="#spokes" x="248" y="450"/></g>
    <g class="wheel-spokes front-spokes"><use href="#spokes" transform="translate(611 450) rotate(36)"/></g>

    <!-- The far leg is behind the frame. -->
    <g class="outline" style="color:#cb8a55">
      <g class="pedal-motion far-thigh" transform="translate(350.00 326.00) rotate(25.18)" color="#d2bb8d">
        <use href="#thigh"/>
      </g>
      <g class="pedal-motion far-shin" transform="translate(411.54 354.93) rotate(114.81)">
        <use href="#shin"/>
      </g>
      <g class="pedal-motion far-foot" transform="translate(382.81 433.73)">
        <use href="#foot"/>
      </g>
    </g>

    <g class="outline" fill="none">
      <!-- Chain, mudguards, and the front fork. -->
      <path d="M248 439 402 425q20 0 24 19c1 10-6 21-17 23l-161-7a10.5 10.5 0 0 1 0-21Z" stroke-width="3.4"/>
      <path d="M251 439 398 426m-142 34 141 6" stroke="#e1bf83" stroke-width="1" stroke-dasharray="2 4" opacity=".9"/>

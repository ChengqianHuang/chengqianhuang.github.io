    <path d="M12 467c135-11 209-3 303-1 173 4 324-20 533-7v139H12Z" fill="url(#road)"/>
    <path d="M12 467c135-11 209-3 303-1 173 4 324-20 533-7" fill="none" stroke="#f8dcaa" stroke-width="2"/>
    <path d="M12 471h836v127H12z" fill="url(#sand-grain)"/>
    <path d="M51 499h65m-27 58h34m535 24h91m-13-52h52m-28-42h55m-691 89h29m-35-49h22"

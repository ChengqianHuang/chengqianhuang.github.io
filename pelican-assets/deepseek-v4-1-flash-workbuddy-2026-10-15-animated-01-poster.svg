<title id="ttl">A pelican riding a bicycle</title>
<desc id="dsc">A white pelican with a red scarf rides a blue bicycle along a sunny road. Both wheels turn, the legs pedal through a full crank rotation, the scarf and tail flutter, and the road markings scroll past. All motion stops when reduced motion is requested.</desc>

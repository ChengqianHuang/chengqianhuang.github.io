@keyframes spin360{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes spinRev{from{transform:rotate(0deg)}to{transform:rotate(-360deg)}}
@keyframes bobHead{0%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}100%{transform:rotate(-2.2deg)}}
@keyframes wiggleTail{0%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}100%{transform:rotate(-4deg)}}
@keyframes drift{from{transform:translateX(0px)}to{transform:translateX(-900px)}}
@keyframes roadRun{from{stroke-dashoffset:0px}to{stroke-dashoffset:-88px}}
@keyframes chainRun{from{stroke-dashoffset:0px}to{stroke-dashoffset:-20px}}
.a{transform-box:view-box;transform-origin:0 0}
.thighN{animation:thighN 1.6s linear infinite}
.shinN{animation:shinN 1.6s linear infinite}
.footN{animation:footN 1.6s linear infinite}
.thighF{animation:thighF 1.6s linear infinite}
.shinF{animation:shinF 1.6s linear infinite}
.footF{animation:footF 1.6s linear infinite}
.wheel{animation:spin360 .8s linear infinite}
.crank{animation:spin360 1.6s linear infinite}
.pedal{animation:spinRev 1.6s linear infinite}
.headBob{animation:bobHead 1.6s ease-in-out infinite}
.tailW{animation:wiggleTail 1.6s ease-in-out infinite}
.clouds{animation:drift 60s linear infinite}
.roadDash{animation:roadRun .181s linear infinite}
.chainRun{animation:chainRun .2s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none !important}}

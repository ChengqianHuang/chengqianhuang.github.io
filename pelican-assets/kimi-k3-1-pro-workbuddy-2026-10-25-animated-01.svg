<svg viewBox="0 0 680 460" width="100%" role="img" aria-labelledby="pelican-title pelican-desc" xmlns="http://www.w3.org/2000/svg">
<title id="pelican-title">Pelican riding a bicycle</title>
<desc id="pelican-desc">A white pelican with a long amber bill pedals a teal bicycle. The wheels, crank, and legs animate, and all motion stops when reduced motion is preferred.</desc>
<defs>
<style>
.wheel,.crank,.upper,.lower{transform-box:view-box}
.wheel{animation:spin 2.8s linear infinite}.rear{transform-origin:180px 350px}.front{transform-origin:500px 350px}
.crank{transform-origin:340px 350px;animation:spin 1.8s linear infinite}
.upper{animation:thigh 1.8s ease-in-out infinite}.lower{animation:shin 1.8s ease-in-out infinite}
.near.upper{transform-origin:325px 255px}.near.lower{transform-origin:370px 300px}
.far.upper{transform-origin:300px 250px;animation-delay:-.9s}.far.lower{transform-origin:285px 298px;animation-delay:-.9s}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes thigh{0%,100%{transform:rotate(-6deg)}25%{transform:rotate(18deg)}50%{transform:rotate(8deg)}75%{transform:rotate(-22deg)}}
@keyframes shin{0%,100%{transform:rotate(4deg)}25%{transform:rotate(-30deg)}50%{transform:rotate(-8deg)}75%{transform:rotate(32deg)}}
@media (prefers-reduced-motion:reduce){.wheel,.crank,.upper,.lower{animation:none!important}}
</style>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<g id="spokes" fill="none" stroke="#888780" stroke-width="1.25"><line x1="0" y1="-61" x2="0" y2="61"/><line x1="-61" y1="0" x2="61" y2="0"/><line x1="-52.8" y1="-30.5" x2="52.8" y2="30.5"/><line x1="-52.8" y1="30.5" x2="52.8" y2="-30.5"/><line x1="-30.5" y1="-52.8" x2="30.5" y2="52.8"/><line x1="-30.5" y1="52.8" x2="30.5" y2="-52.8"/></g>
</defs>

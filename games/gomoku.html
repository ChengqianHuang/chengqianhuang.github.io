<main><div class="game-breadcrumb container"><a href="/games.html">← 全部游戏</a><span>五子棋</span></div><section class="gomoku-main container" aria-labelledby="gomoku-title"><div class="gomoku-heading"><h1 id="gomoku-title">五子棋</h1><p>黑棋先行，连成五颗即可获胜。</p></div>
<div class="gomoku-machine" id="gomoku-machine"><div class="gomoku-play"><div class="gomoku-turn"><span id="gomoku-status" class="gomoku-status" role="status" aria-live="polite">轮到你落子</span><span class="gomoku-count" id="gomoku-count">第 1 手</span></div><div class="gomoku-board-frame"><canvas id="gomoku-canvas" width="720" height="720" tabindex="0" aria-label="15 乘 15 五子棋棋盘" aria-describedby="gomoku-instruction">请使用支持 Canvas 的浏览器。</canvas><div class="gomoku-pause-overlay" id="gomoku-pause-overlay" hidden><strong>对局已暂停</strong><button id="gomoku-resume" type="button">继续对局</button></div></div><div class="gomoku-confirm-row"><span id="gomoku-selection">点选交叉点，再点落子</span><button id="gomoku-confirm" type="button" disabled>落子</button></div><div class="gomoku-coordinate"><span id="gomoku-last">空局，试试从天元 H8 开始</span><span id="gomoku-level-label">标准 · 自由五子棋</span></div></div>

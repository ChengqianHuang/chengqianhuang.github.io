name: Validate pelican submissions
on:
  pull_request:
    paths: ['pelican*', 'pelican-results/**', 'pelican-assets/**', 'schemas/**', 'scripts/**', 'requirements-validation.txt', '.github/workflows/validate-pelican.yml']
  push:
    branches: [main]
    paths: ['pelican*', 'pelican-results/**', 'pelican-assets/**', 'schemas/**', 'scripts/**', 'requirements-validation.txt', '.github/workflows/validate-pelican.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-validation.txt
      - run: python scripts/validate_pelican.py
      - run: python -m unittest discover -s scripts -p 'test_*.py'

name: Validate racing game
on:
  push:
    branches: [main]
    paths: ['racing/**', 'games/harbor-rush.html', 'scripts/test_racing.mjs', '.github/workflows/validate-racing.yml']
  pull_request:
    paths: ['racing/**', 'games/harbor-rush.html', 'scripts/test_racing.mjs', '.github/workflows/validate-racing.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: racing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: racing/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run build
      - run: git diff --exit-code -- dist

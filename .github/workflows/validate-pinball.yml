name: Validate Brass Pinball
on:
  pull_request:
    paths: ['pinball/**', 'games/brass-pinball.html', 'scripts/test_pinball.mjs', '.github/workflows/validate-pinball.yml']
  push:
    branches: [main]
    paths: ['pinball/**', 'games/brass-pinball.html', 'scripts/test_pinball.mjs', '.github/workflows/validate-pinball.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts
        working-directory: pinball
      - run: npm test
        working-directory: pinball
      - run: npm run build
        working-directory: pinball
      - run: git diff --exit-code -- pinball/dist

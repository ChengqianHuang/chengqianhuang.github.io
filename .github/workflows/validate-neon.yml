name: Validate Neon Rift
on:
  pull_request:
    paths: ['neon*', 'games/neon-rift.html', 'scripts/test_neon*', '.github/workflows/validate-neon.yml']
  push:
    branches: [main]
    paths: ['neon*', 'games/neon-rift.html', 'scripts/test_neon*', '.github/workflows/validate-neon.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check neon.js && node --check neon-renderer.mjs && node --check neon-audio.mjs
      - run: node scripts/test_neon.mjs

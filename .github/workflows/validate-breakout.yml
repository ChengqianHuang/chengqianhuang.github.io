name: Validate Breakout game
on:
  pull_request:
    paths: ['breakout*', 'game-assets/breakout/**', 'games/breakout.html', 'scripts/test_breakout.mjs', '.github/workflows/validate-breakout.yml']
  push:
    branches: [main]
    paths: ['breakout*', 'game-assets/breakout/**', 'games/breakout.html', 'scripts/test_breakout.mjs', '.github/workflows/validate-breakout.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --check breakout.js && node --check breakout-art.mjs && node --check breakout-scenes.mjs && node --check breakout-materials.mjs
      - run: node scripts/test_breakout.mjs
